services:
  - type: web
    name: crowd-control
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22.18.0
      # Secrets: Render asks for these once, then keeps them out of git.
      - key: BESTTIME_API_KEY_PRIVATE
        sync: false
      - key: BESTTIME_API_KEY_PUBLIC
        sync: false
      - key: AI_API_KEY
        sync: false
      # Non-secret model settings for the Crowd Assistant.
      - key: AI_BASE_URL
        value: https://api.z.ai/api/paas/v4
      - key: AI_MODEL
        value: glm-4.5-flash
